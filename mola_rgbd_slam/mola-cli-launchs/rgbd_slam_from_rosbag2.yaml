# -----------------------------------------------------------------------------
#                        MOLA system definition
# RGB-D visual SLAM (mola::RgbdSlam) from a ROS 2 bag (mcap or sqlite3) with
# the topics of an RGB-D camera, e.g. a RealSense D4xx recorded with
# realsense2_camera. Depth may be the raw "depth/image_rect_raw" (it is then
# reprojected into the intensity camera using /tf) or an already registered
# "aligned_depth_to_color/image_raw". The camera_info topics default to the
# "camera_info" sibling of each image topic.
#
# Usage:
#   ROSBAG2_FILE=/path/to/bag.mcap \
#   RGBD_DEPTH_TOPIC=/camera/camera/depth/image_rect_raw \
#   RGBD_INTENSITY_TOPIC=/camera/camera/color/image_raw \
#   mola-cli rgbd_slam_from_rosbag2.yaml
#
# Set RGBD_TRAJECTORY_FILE=traj.tum to save the vehicle trajectory on exit.
# -----------------------------------------------------------------------------

modules:
  # =====================
  # MolaViz (ImGui GUI)
  # =====================
  - name: viz
    type: ${MOLA_GUI_MODULE|mola::MolaVizImGui}
    params: ~

  # =====================
  # ROS 2 bag input
  # =====================
  - name: rosbag2_input
    type: mola::Rosbag2Dataset
    execution_rate: 50 # Hz
    params:
      rosbag_filename: ${ROSBAG2_FILE}
      base_link_frame_id: ${RGBD_BASE_LINK|base_link}
      time_warp_scale: ${MOLA_TIME_WARP|1.0}
      start_paused: ${MOLA_DATASET_START_PAUSED|false}
      sensors:
        - topic: ${RGBD_DEPTH_TOPIC|/camera/camera/depth/image_rect_raw}
          type: CObservation3DRangeScan
          sensorLabel: rgbd
          # Optional; empty means depth only (not usable by RgbdSlam):
          intensity_topic: ${RGBD_INTENSITY_TOPIC|/camera/camera/color/image_raw}
          # Maximum stamp difference to pair depth and intensity frames [s]:
          max_time_offset: 0.005

  # =====================
  # RGB-D SLAM front-end
  # =====================
  - name: rgbd_slam
    type: mola::RgbdSlam
    raw_data_source: rosbag2_input
    execution_rate: 30 # Hz
    verbosity_level: "${MOLA_VERBOSITY|INFO}"
    params:
      sensor_label: rgbd
      max_features: ${RGBD_MAX_FEATURES|400}
      min_distance: 12.0
      redetect_below: 150
      lk_win_size: 21
      lk_max_levels: 3
      min_pnp_points: 12
      # Depth range used for landmarks. Raising min_depth is also a way to
      # ignore parts of the robot itself that are in view:
      min_depth: ${RGBD_MIN_DEPTH|0.2}
      max_depth: ${RGBD_MAX_DEPTH|8.0}
      ba_window_size: 8
      kf_max_frames_gap: 20
      kf_min_frames_gap: 2
      kf_min_tracked: 80
      kf_min_tracked_ratio: 0.6
      kf_min_parallax_px: 18.0
      estimated_trajectory_file: ${RGBD_TRAJECTORY_FILE|''}
      publish_viz_2d: true
      viz2d_title: RGB-D SLAM tracking
      viz2d_win_pos: 10 60 800 600 # [x y width height]
      publish_viz_3d: true
