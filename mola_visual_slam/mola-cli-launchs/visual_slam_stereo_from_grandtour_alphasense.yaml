# -----------------------------------------------------------------------------
#                        MOLA system definition
# Stereo visual SLAM (mola::VisualSlam, mode=stereo) from the GrandTour dataset's
# Alphasense rig (front_left / front_right, the narrow-baseline mono pair --
# NOT front_center/left/right, which are wide-FOV RGB cameras). Camera
# intrinsics (fisheye/equidistant) are read automatically from each topic's own
# sensor_msgs/CameraInfo message; the (fixed, per-rig) sensor poses and the
# front_left->front_right extrinsic are given here, since alphasense.bag itself
# carries no /tf and its camera_info is unrectified (no baseline term).
#
# All the poses below come from the mission's own <mission>_tf_model.bag
# /tf_static tree (base -> box_base -> alphasense_base -> front_left|front_right;
# note alphasense_base is the MIDPOINT of the pair, not the left camera).
# right_camera_pose makes VisualSlam rectify every pair
# (mrpt::img::CStereoRectifyMap) before matching, since the raw pair is neither
# epipolar-aligned nor sharing one camera's intrinsics. The fixed_sensor_pose
# values additionally let VisualSlam report body-frame poses, which is the frame
# this dataset's ground truth uses.
#
# Usage:
#   MOLA_INPUT_ROSBAG1=/path/to/<mission>_alphasense.bag \
#   mola-cli visual_slam_stereo_from_grandtour_alphasense.yaml
# -----------------------------------------------------------------------------

modules:
  # =====================
  # MolaViz (ImGui GUI)
  # =====================
  - name: viz
    type: ${MOLA_GUI_MODULE|mola::MolaVizImGui}
    enabled: ${MOLA_WITH_GUI|true}
    params: ~

  # =====================
  # GrandTour alphasense stereo pair (front_left + front_right)
  # =====================
  - name: dataset_input
    type: mola::Rosbag1Dataset
    execution_rate: 20 # Hz
    quit_mola_app_on_dataset_end: ${MOLA_QUIT_ON_DATASET_END|false}
    params:
      rosbag_filename: ${MOLA_INPUT_ROSBAG1}
      time_warp_scale: ${MOLA_TIME_WARP|1.0}
      start_paused: ${MOLA_DATASET_START_PAUSED|false}
      base_link_frame_id: "${MOLA_TF_BASE_LINK|base}"

      sensors:
        - topic: /boxi/alphasense/front_left/image_raw/compressed
          type: CObservationImage
          sensorLabel: image_0
          # base -> alphasense_front_left, composed from tf_model.bag's own
          # /tf_static: base -> box_base -> alphasense_base -> front_left.
          fixed_sensor_pose: "0.445966 0.064945 0.212504 -90.0457 1.0446 -99.9009"
          use_fixed_sensor_pose: true

        - topic: /boxi/alphasense/front_right/image_raw/compressed
          type: CObservationImage
          sensorLabel: image_1
          # base -> alphasense_front_right, composed the same way
          fixed_sensor_pose: "0.444776 -0.045125 0.211165 -90.0398 -0.1474 -99.8744"
          use_fixed_sensor_pose: true

  # =====================
  # Stereo visual SLAM front-end
  # =====================
  - name: visual_slam
    type: mola::VisualSlam
    raw_data_source: dataset_input
    execution_rate: 20 # Hz
    verbosity_level: "${MOLA_VERBOSITY|INFO}"
    params:
      mode: stereo
      left_label: image_0
      right_label: image_1
      # Unlike KITTI's image_0/image_1, these images are NOT pre-rectified
      # (the bag's own camera_info has R=identity) and the two optical axes
      # are not perfectly parallel. right_camera_pose (front_left ->
      # front_right, same calibration source as the fixed_sensor_pose values
      # above) makes onNewObservation() build a CStereoRectifyMap and rectify
      # every pair before processStereoFrame() - stereo_baseline itself is
      # then derived automatically from the rectified geometry, not needed
      # here.
      right_camera_pose: "0.110078 -0.000468 -0.001201 -1.1752 0.1992 0.0244"
      # Some missions ship one of the two streams 180 deg rotated while their
      # camera_info still describes the upright image (confirmed on arc-3's
      # front_left, whose camera_info is byte-identical to heap-1's). No
      # rectification can align two images whose rows run in opposite
      # directions, so every stereo match then fails and the map stays empty.
      # Uncomment for such a mission:
      # left_image_rotate_180: true
      max_features: 500
      min_distance: 12.0
      redetect_below: 200
      lk_win_size: 21
      lk_max_levels: 3
      min_pnp_points: 12
      kf_max_frames_gap: 10
      kf_min_frames_gap: 2
      kf_min_tracked: 120
      kf_min_tracked_ratio: 0.6
      kf_min_parallax_px: 18.0
      publish_viz_2d: true
      publish_viz_3d: true
      viz2d_title: Visual SLAM (stereo, GrandTour alphasense)
      viz2d_win_pos: 10 60 1000 350 # [x y width height]
